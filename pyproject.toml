[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent"
version = "0.1.0"
description = "A minimal local coding agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
my-agent = "cli:main"
mini-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "context", "model_client", "my_agent", "parser", "session", "tools", "workspace"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
